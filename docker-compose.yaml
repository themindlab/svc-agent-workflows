services:
  svc-agent-workflows:
    image: ${IMAGE_NAME:-svc-agent-workflows}:${IMAGE_TAG:-local}
    build:
      context: ../../
      dockerfile: services/svc-agent-workflows/Dockerfile
    command: tail -f /dev/null
    env_file:
      - .env
    networks:
      - standard-network
    profiles:
      - ci
    depends_on:
      svc-data-gateway:
        condition: service_healthy
      svc-data-query:
        condition: service_healthy
      svc-auth:
        condition: service_started
      svc-postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-svc-postgres}
      DATABASE_USER: ${DATABASE_USER:-mindlab}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-the_password}
      DATABASE_NAME: ${DATABASE_NAME:-ai_workflows}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      PGHOST: ${DATABASE_HOST:-svc-postgres}
      PGPORT: ${DATABASE_PORT:-5432}
      HTTP_DATA_SERVER: ${HTTP_DATA_SERVER:-svc-data-gateway}
      HTTP_QUERY_SERVER: ${HTTP_QUERY_SERVER:-svc-data-query}
      AUTH_SECRET: ${AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      USE_FAKE_MODEL: ${USE_FAKE_MODEL:-true}

  svc-data-query:
    image: ${QUERY_SERVER_IMAGE:-europe-west2-docker.pkg.dev/zoo-containers/zoo-dev/svc-data-query:latest}
    env_file:
      - .env
    depends_on:
      svc-data-gateway:
        condition: service_healthy
      svc-translation:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      start_period: 10s
    networks:
      - standard-network
    profiles:
      - ci
    environment:
      HTTP_DATA_SERVER: svc-data-gateway
      HTTP_TRANSLATOR_SERVER: svc-translation
      REDIS_MASTER_HOST: svc-redis
      REDIS_REPLICA_HOST: svc-redis

  svc-auth:
    image: ${USER_SERVER_IMAGE:-europe-west2-docker.pkg.dev/zoo-containers/zoo-dev/svc-auth:latest}
    env_file:
      - .env
    depends_on:
      svc-data-gateway:
        condition: service_healthy
    networks:
      - standard-network
    profiles:
      - ci
    environment:
      DATABASE_HOST: svc-postgres
      DATABASE_PORT: "5432"
      PGHOST: svc-postgres
      PGPORT: "5432"
      CONTROL_PORT: "6666"
      DATABASE_COMMANDER_URL: http://svc-pg-control-plane:6666
      HTTP_DATA_SERVER: svc-data-gateway
      REDIS_MASTER_HOST: svc-redis
      REDIS_REPLICA_HOST: svc-redis

  svc-data-gateway:
    image: ${DATA_SERVER_IMAGE:-europe-west2-docker.pkg.dev/zoo-containers/zoo-dev/data-gateway:latest}
    restart: always
    env_file:
      - .env
    depends_on:
      svc-postgres:
        condition: service_healthy
      svc-redis:
        condition: service_healthy
      svc-pg-control-plane:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      start_period: 10s
    networks:
      - standard-network
    profiles:
      - ci
    environment:
      DATABASE_HOST: svc-postgres
      DATABASE_PORT: "5432"
      DATABASE_COMMANDER_URL: http://svc-pg-control-plane:6666
      REDIS_MASTER_HOST: svc-redis
      REDIS_REPLICA_HOST: svc-redis
      PGHOST: svc-postgres
      PGPORT: "5432"

  svc-translation:
    image: ${TRANSLATOR_SERVER_IMAGE:-europe-west2-docker.pkg.dev/zoo-containers/zoo-dev/svc-translation:latest}
    env_file:
      - .env
    depends_on:
      svc-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      start_period: 10s
    networks:
      - standard-network
    profiles:
      - ci
    environment:
      PGHOST: svc-postgres
      PGPORT: "5432"
      SOURCE_POSTGRES_HOST: svc-postgres
      SOURCE_POSTGRES_PORT: "5432"
      TARGET_POSTGRES_HOST: svc-postgres
      TARGET_POSTGRES_PORT: "5432"

  svc-import-experiments-rds:
    image: ${EXPERIMENT_IMPORTER_IMAGE:-europe-west2-docker.pkg.dev/zoo-containers/zoo-dev/svc-import-experiments-rds:latest}
    env_file:
      - .env
    depends_on:
      svc-data-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      start_period: 10s
    networks:
      - standard-network
    profiles:
      - ci
    environment:
      DATABASE_HOST: svc-postgres
      REDIS_MASTER_HOST: svc-redis
      HTTP_DATA_SERVER: svc-data-gateway
      HTTP_TRANSLATOR_SERVER: svc-translation

  svc-postgres:
    image: postgres:13.4
    environment:
      POSTGRES_MULTIPLE_DATABASES: development,test,translations,ai_workflows
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-the_password}
      POSTGRES_USER: ${DATABASE_USER:-mindlab}
      DB_TO_POPULATE: development
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-mindlab}" ]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - standard-network
    profiles:
      - ci

  svc-redis:
    image: redislabs/rejson:latest
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - standard-network
    profiles:
      - ci

  svc-pg-control-plane:
    image: ${PG_CONTROL_IMAGE:-europe-west2-docker.pkg.dev/zoo-containers/zoo-dev/pg-control-plane:latest}
    restart: always
    env_file:
      - .env
    depends_on:
      svc-postgres:
        condition: service_healthy
    networks:
      - standard-network
    profiles:
      - ci
    environment:
      PGHOST: svc-postgres
      PGPORT: "5432"
      CONTROL_PORT: "6666"
      DUMPS_DIR: /dumps

networks:
  standard-network:
    driver: bridge
